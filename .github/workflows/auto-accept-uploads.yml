name: Accept uploads

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  accept:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Allow only new files in uploads/
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/files" | python3 -c '
          import json, sys
          files = json.load(sys.stdin)
          if not files:
              print("no files")
              raise SystemExit(1)
          bad = False
          for f in files:
              name = f.get("filename", "")
              status = f.get("status", "")
              print(f"{status}: {name}")
              if status not in ("added", "copied"):
                  print("blocked: only adding new files is allowed")
                  bad = True
                  continue
              if not name.startswith("uploads/") or name.rstrip("/") == "uploads":
                  print("blocked: path must be inside uploads/")
                  bad = True
              if ".github" in name.split("/"):
                  print("blocked: .github is not allowed")
                  bad = True
              if ".." in name.split("/"):
                  print("blocked: illegal path")
                  bad = True
          if bad:
              raise SystemExit(1)
          '

      - name: Comment if rejected
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "Авто-приём не сработал: можно **только добавлять новые файлы в \`uploads/\`**. README, workflows и удаления бот не мержит."

      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --squash --delete-branch --subject "drop: #${{ github.event.pull_request.number }}"
